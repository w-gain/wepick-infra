name: wepick-prod

services:
  caddy:
    image: caddy:2.10-alpine
    container_name: wepick_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:?DOMAIN_NAME is required}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required}
    volumes:
      - ../../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - uploads_data:/srv/uploads:ro
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_started
    restart: unless-stopped

  frontend:
    image: ${FE_IMAGE:?FE_IMAGE is required}:${FE_IMAGE_TAG:?FE_IMAGE_TAG is required}
    container_name: wepick_frontend
    expose:
      - "3000"
    restart: unless-stopped

  backend:
    image: ${BE_IMAGE:?BE_IMAGE is required}:${BE_IMAGE_TAG:?BE_IMAGE_TAG is required}
    container_name: wepick_backend
    expose:
      - "8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:?MYSQL_USER is required}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      SESSION_COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: https://${DOMAIN_NAME:?DOMAIN_NAME is required}
    volumes:
      - uploads_data:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: wepick_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?MYSQL_DATABASE is required}
      MYSQL_USER: ${MYSQL_USER:?MYSQL_USER is required}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  mysql_data:
    name: wepick_mysql_data
  caddy_data:
    name: wepick_caddy_data
  caddy_config:
    name: wepick_caddy_config
  uploads_data:
    name: wepick_uploads_data
